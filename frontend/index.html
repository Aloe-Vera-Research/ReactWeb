
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>AloeGreen | AI-IoT Smart Agriculture</title>

    <meta
      name="description"
      content="AloeGreen is a research-driven AI-IoT smart agriculture platform for Aloe vera cultivation, integrating field monitoring, yield prediction, disease detection, fertilizer recommendations, environmental forecasting, and market insights."
    />

    <meta
      name="keywords"
      content="AloeGreen, Aloe vera, smart agriculture, AI agriculture, IoT agriculture, yield prediction, disease detection, fertilizer recommendation"
    />

    <meta name="author" content="AloeGreen Research Team" />
    <meta name="robots" content="index, follow" />

    <!-- Application information -->
    <meta name="application-name" content="AloeGreen" />
    <meta name="apple-mobile-web-app-title" content="AloeGreen" />

    <!-- Browser appearance -->
    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light" />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="AloeGreen | AI-IoT Smart Agriculture"
    />

    <meta
      property="og:description"
      content="A research-driven AI-IoT platform designed to support smarter Aloe vera cultivation."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="/android-chrome-512x512.png"
    />

    <meta
      property="og:image:alt"
      content="AloeGreen logo"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="AloeGreen | AI-IoT Smart Agriculture"
    />

    <meta
      name="twitter:description"
      content="An integrated AI-IoT smart agriculture research platform for Aloe vera cultivation."
    />

    <meta
      name="twitter:image"
      content="/android-chrome-512x512.png"
    />

  <body>
    <noscript>
      AloeGreen requires JavaScript to display the project website.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
